[package]
name = "bsp-museum"
version = "0.3.0"
description = "Galeria navegável do acervo de mapas GoldSrc: planta baixa, entidades e diagnóstico"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
strip = true
