name: Release

# Gera os instaladores (Windows, Linux, macOS) ao empurrar uma tag `vX.Y.Z`.
# Atualização automática (tauri-plugin-updater): só liga com o secret TAURI_SIGNING_PRIVATE_KEY.
# Sem ele o build sai sem assinatura e o app avisa que a atualização não está configurada.
# Com ele, src-tauri/tauri.updater.conf.json (pubkey + endpoint) entra no build e o tauri-action
# gera latest.json no release: publicar o rascunho é o que o torna acessível ao app.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: Windows, os: windows-latest }
          - { label: Linux, os: ubuntu-22.04 }
          - { label: macOS (Apple Silicon), os: macos-latest, args: "--target aarch64-apple-darwin" }
          - { label: macOS (Intel), os: macos-13, args: "--target x86_64-apple-darwin" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Dependências do Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev patchelf
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Atualização automática (só com a chave de assinatura)
        id: updater
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY ausente: build sem atualização automática."
            echo "args=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -q PREENCHER src-tauri/tauri.updater.conf.json; then
            echo "::error::src-tauri/tauri.updater.conf.json ainda tem a chave pública de exemplo"
            exit 1
          fi
          echo "args=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "bsp-museum ${{ github.ref_name }}"
          releaseDraft: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }} ${{ steps.updater.outputs.args }}

  mcp:
    name: Servidor MCP (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: Windows, os: windows-latest, ext: ".exe", asset: windows-x64 }
          - { label: Linux, os: ubuntu-22.04, ext: "", asset: linux-x64 }
          - { label: macOS (Apple Silicon), os: macos-latest, ext: "", asset: macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Compila (sem interface gráfica)
        working-directory: src-tauri
        run: cargo build --release --no-default-features --bin bsp-museum-mcp
      - name: Anexa ao release (rascunho)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "src-tauri/target/release/bsp-museum-mcp${{ matrix.ext }}" "bsp-museum-mcp-${{ matrix.asset }}${{ matrix.ext }}"
          gh release upload "${{ github.ref_name }}" "bsp-museum-mcp-${{ matrix.asset }}${{ matrix.ext }}" --clobber || echo "release ainda não existe; artefato não anexado"
