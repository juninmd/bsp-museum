name: Release

# Commit semântico no master → calcula a versão (feat=minor, fix/perf=patch, !/BREAKING=major),
# gera os instaladores com essa versão, cria a tag vX.Y.Z e publica o release (latest.json incluso)
# para o app se atualizar sozinho. chore/docs/ci/refactor/test não geram release.
# Atualização automática: só liga com o secret TAURI_SIGNING_PRIVATE_KEY (+ pubkey em
# src-tauri/tauri.updater.conf.json). Sem ele o build sai sem assinatura.
# O release nasce como rascunho e só é publicado depois de todos os binários subirem.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Planejar versão
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - id: plan
        run: |
          bun scripts/release-plan.ts > plan.json
          cat plan.json
          {
            echo "release=$(jq -r .release plan.json)"
            echo "version=$(jq -r .version plan.json)"
            echo "tag=$(jq -r .tag plan.json)"
          } >> "$GITHUB_OUTPUT"
          jq -r .notes plan.json > notes.md
          if git ls-remote --exit-code --tags origin "refs/tags/$(jq -r .tag plan.json)" >/dev/null 2>&1; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Tag já existe: nada a fazer."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: notes.md

  bundle:
    name: ${{ matrix.label }}
    needs: plan
    if: needs.plan.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: Windows, os: windows-latest }
          - { label: Linux, os: ubuntu-22.04 }
          - { label: macOS (Apple Silicon), os: macos-latest, args: "--target aarch64-apple-darwin" }
          - { label: macOS (Intel), os: macos-13, args: "--target x86_64-apple-darwin" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Dependências do Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev patchelf
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Atualização automática (só com a chave de assinatura)
        id: updater
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY ausente: build sem atualização automática."
            echo "args=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -q PREENCHER src-tauri/tauri.updater.conf.json; then
            echo "::error::src-tauri/tauri.updater.conf.json ainda tem a chave pública de exemplo"
            exit 1
          fi
          echo "args=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_OUTPUT"
      - name: Versão da release
        shell: bash
        run: echo '{"version":"${{ needs.plan.outputs.version }}"}' > src-tauri/tauri.release.conf.json
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.plan.outputs.tag }}
          releaseName: "bsp-museum ${{ needs.plan.outputs.tag }}"
          releaseBody: "Veja as mudanças abaixo."
          releaseDraft: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json ${{ steps.updater.outputs.args }}

  mcp:
    name: Servidor MCP (${{ matrix.label }})
    needs: [plan, bundle]
    if: needs.plan.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: Windows, os: windows-latest, ext: ".exe", asset: windows-x64 }
          - { label: Linux, os: ubuntu-22.04, ext: "", asset: linux-x64 }
          - { label: macOS (Apple Silicon), os: macos-latest, ext: "", asset: macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Compila (sem interface gráfica)
        working-directory: src-tauri
        run: cargo build --release --no-default-features --bin bsp-museum-mcp
      - name: Anexa ao release (rascunho)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "src-tauri/target/release/bsp-museum-mcp${{ matrix.ext }}" "bsp-museum-mcp-${{ matrix.asset }}${{ matrix.ext }}"
          gh release upload "${{ needs.plan.outputs.tag }}" "bsp-museum-mcp-${{ matrix.asset }}${{ matrix.ext }}" --clobber || echo "release ainda não existe; artefato não anexado"

  publish:
    name: Publicar release
    needs: [plan, bundle, mcp]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
      - uses: actions/checkout@v7
      - name: Confere o manifesto e publica
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          assets=$(gh release view "$TAG" --json assets -q '.assets[].name')
          echo "$assets"
          if echo "$assets" | grep -q '^latest.json$'; then
            gh release download "$TAG" -p latest.json -O latest.json
            test "$(jq -r .version latest.json)" = "$VERSION" || { echo "::error::latest.json com versão errada"; exit 1; }
            jq -e '.platforms | length > 0' latest.json >/dev/null
          else
            echo "Sem latest.json (build sem assinatura): publicando sem atualização automática."
          fi
          gh release edit "$TAG" --draft=false --latest --notes-file notes.md --target "${{ github.sha }}"
