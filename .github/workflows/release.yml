name: Release

# Commit semântico no master → calcula a versão e publica aquele commit como release:
# feat=minor, fix/perf/refactor=patch, !/BREAKING CHANGE=major. chore/docs/ci/test/build/style não geram release.
# Cada release nasce como rascunho (release-commit.yml), recebe os instaladores e o bsp-museum-mcp e só é publicada
# com o verify verde. A agenda de 6 em 6 horas retoma um rascunho interrompido e drena a fila (um release por commit).
# A tag vX.Y.Z é criada na publicação; é a fonte da versão, não o tauri.conf.json.
# Atualização automática: só liga com TAURI_SIGNING_PRIVATE_KEY (+ chave pública em tauri.updater.conf.json);
# sem a chave a release sai sem latest.json e o app não se atualiza sozinho.

on:
  push:
    branches: [master]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  plan:
    name: Planejar versão
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      candidate: ${{ steps.releases.outputs.candidate }}
      more: ${{ steps.releases.outputs.more }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: git fetch origin master --tags
      - uses: oven-sh/setup-bun@v2
      - id: releases
        run: bun scripts/release.ts plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publicar commit
    needs: plan
    if: needs.plan.outputs.candidate != '{}'
    permissions:
      contents: write
    uses: ./.github/workflows/release-commit.yml
    with:
      sha: ${{ fromJSON(needs.plan.outputs.candidate).sha }}
      tag: ${{ fromJSON(needs.plan.outputs.candidate).tag }}
      version: ${{ fromJSON(needs.plan.outputs.candidate).version }}
      previous-tag: ${{ fromJSON(needs.plan.outputs.candidate).previousTag }}
    secrets:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  next:
    name: Continuar a fila
    needs: [plan, publish]
    if: needs.plan.outputs.more == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
    steps:
      - run: gh workflow run release.yml --ref master --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
