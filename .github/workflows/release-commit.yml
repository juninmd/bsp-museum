name: Publish commit

# Reusable: publica UM commit como release (tag vX.Y.Z). Chamado por release.yml, que decide o candidato
# a partir dos commits semânticos. O rascunho é criado aqui (e retomado se já existir), os instaladores sobem
# em paralelo com os servidores MCP, e só depois do verify verde o rascunho é publicado.

on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string
      tag:
        required: true
        type: string
      version:
        required: true
        type: string
      previous-tag:
        required: true
        type: string
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_SIGNING_IDENTITY:
        required: false
      APPLE_ID:
        required: false
      APPLE_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false

jobs:
  verify:
    name: Verificar o commit
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Dependências do Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: debug
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - name: Clippy (interface)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Testes (interface)
        working-directory: src-tauri
        run: cargo test
      - name: Clippy (núcleo + MCP)
        working-directory: src-tauri
        run: cargo clippy --no-default-features --all-targets -- -D warnings
      - name: Testes (núcleo + MCP)
        working-directory: src-tauri
        run: cargo test --no-default-features

  # Roda ao lado do verify: só o publicar espera por ele, então os instaladores não ficam na fila dos testes.
  prepare:
    name: Preparar rascunho
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.draft.outputs.release-id }}
      release-notes: ${{ steps.draft.outputs.release-notes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: Gerar o changelog
        run: bun scripts/release.ts notes "$RELEASE_TAG" "$RELEASE_SHA" "$PREVIOUS_TAG" release-notes.md
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ inputs.sha }}
          PREVIOUS_TAG: ${{ inputs.previous-tag }}
      - id: draft
        name: Criar ou retomar o rascunho
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > release-state.txt 2> release-error.txt; then
            test "$(cat release-state.txt)" = true
            gh release edit "$RELEASE_TAG" --target "$RELEASE_SHA" --title "bsp-museum $RELEASE_TAG" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" --target "$RELEASE_SHA" --draft --title "bsp-museum $RELEASE_TAG" --notes-file release-notes.md
          fi
          id=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)
          echo "release-id=$id" >> "$GITHUB_OUTPUT"
          delimiter="BSP_MUSEUM_NOTES_$(date +%s%N)"
          printf 'release-notes<<%s\n' "$delimiter" >> "$GITHUB_OUTPUT"
          cat release-notes.md >> "$GITHUB_OUTPUT"
          printf '\n%s\n' "$delimiter" >> "$GITHUB_OUTPUT"

  instaladores:
    name: Instaladores (${{ matrix.cache-key }})
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            cache-key: macos-aarch64
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            cache-key: macos-x86_64
          - platform: ubuntu-22.04
            args: ""
            cache-key: linux-x86_64
          - platform: windows-latest
            args: ""
            cache-key: windows-x86_64
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Dependências do Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release-${{ matrix.cache-key }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Versão desta release
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: printf '{"version":"%s"}\n' "$RELEASE_VERSION" > src-tauri/tauri.release.conf.json
      # Sem a chave privada o bundle sai sem os artefatos do updater (e sem latest.json): a release é publicada
      # com os instaladores, mas o app não se atualiza sozinho.
      - name: Atualização automática (só com a chave de assinatura)
        id: updater
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY ausente: build sem atualização automática."
            echo "args=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -q PREENCHER src-tauri/tauri.updater.conf.json; then
            echo "::error::src-tauri/tauri.updater.conf.json ainda tem a chave pública de exemplo"
            exit 1
          fi
          echo "args=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_OUTPUT"
      # Sem certificado Apple o bundle sai com assinatura ad-hoc ("-", em tauri.conf.json): sem ela o macOS
      # mostra "o app está danificado" ao abrir um .dmg baixado. Com os secrets o Tauri assina e notariza.
      - name: Assinatura Apple (opcional)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do
              printf '%s=%s\n' "$v" "${!v}" >> "$GITHUB_ENV"
            done
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
              for v in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do printf '%s=%s\n' "$v" "${!v}" >> "$GITHUB_ENV"; done
            fi
            echo "Developer ID signing enabled"
          else
            echo "Sem certificado Apple: assinatura ad-hoc"
          fi
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun run tauri
          releaseId: ${{ needs.prepare.outputs.release-id }}
          tagName: ${{ inputs.tag }}
          releaseBody: ${{ needs.prepare.outputs.release-notes }}
          releaseDraft: true
          uploadUpdaterJson: false
          updaterJsonPreferNsis: true
          retryAttempts: 3
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json ${{ steps.updater.outputs.args }}

  mcp:
    name: Servidor MCP (${{ matrix.asset }})
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: Windows, os: windows-latest, ext: ".exe", asset: windows-x64 }
          - { label: Linux, os: ubuntu-22.04, ext: "", asset: linux-x64 }
          - { label: macOS (Apple Silicon), os: macos-latest, ext: "", asset: macos-arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: mcp-${{ matrix.asset }}
      - name: Compilar (sem interface gráfica)
        working-directory: src-tauri
        run: cargo build --release --no-default-features --bin bsp-museum-mcp
      - name: Anexar ao rascunho
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          cp "src-tauri/target/release/bsp-museum-mcp${{ matrix.ext }}" "bsp-museum-mcp-${{ matrix.asset }}${{ matrix.ext }}"
          gh release upload "$RELEASE_TAG" "bsp-museum-mcp-${{ matrix.asset }}${{ matrix.ext }}" --clobber

  publicar:
    name: Publicar release
    needs: [verify, prepare, instaladores, mcp]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: Conferir o updater e publicar
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ inputs.sha }}
          PREVIOUS_TAG: ${{ inputs.previous-tag }}
        run: |
          set -euo pipefail
          bun scripts/release.ts notes "$RELEASE_TAG" "$RELEASE_SHA" "$PREVIOUS_TAG" release-notes.md
          mkdir -p signatures
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.sig' --dir signatures || true
          id=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)
          if compgen -G "signatures/*.sig" > /dev/null; then
            gh api "repos/$GITHUB_REPOSITORY/releases/$id" > release.json
            bun scripts/release.ts manifest release.json signatures release-notes.md latest.json "$RELEASE_TAG" "$RELEASE_VERSION"
            gh release upload "$RELEASE_TAG" latest.json --repo "$GITHUB_REPOSITORY" --clobber
            gh api "repos/$GITHUB_REPOSITORY/releases/$id" > release.json
            bun scripts/release.ts verify latest.json release.json "$RELEASE_TAG" "$RELEASE_VERSION"
          else
            echo "Sem assinatura: release publicada sem latest.json (o app não se atualiza sozinho)."
          fi
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false
