name: Security Scan

on:
  workflow_dispatch:
  push:
    branches: [master]
  schedule:
    - cron: '0 0 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    uses: juninmd/base-actions/.github/workflows/reusable-security-scan.yml@main
